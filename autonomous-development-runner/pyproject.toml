[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "autonomous-development-runner"
version = "0.1.0"
description = "Local resumable task runner for Codex CLI"
requires-python = ">=3.10"
[project.scripts]
adr = "adr.__main__:main"
[tool.setuptools]
packages = ["adr"]
